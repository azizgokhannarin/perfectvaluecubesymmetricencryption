name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CC=clang" >> "$GITHUB_ENV"
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CC=gcc" >> "$GITHUB_ENV"
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build -j2
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizer:
    name: sanitizer (${{ matrix.profile }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        profile: [address, undefined, memory]
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: "detect_leaks=1:halt_on_error=1"
      UBSAN_OPTIONS: "halt_on_error=1:print_stacktrace=1"
      MSAN_OPTIONS: "halt_on_error=1:exit_code=86"
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-sanitizer \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPVCROTSYMENC1_SANITIZER=${{ matrix.profile }} \
            -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-sanitizer --parallel 2
      - name: Test
        run: ctest --test-dir build-sanitizer --output-on-failure

  optimization:
    name: optimization (${{ matrix.level }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - level: O0
            flag: -O0
          - level: O2
            flag: -O2
          - level: O3
            flag: -O3
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-optimization \
            -DCMAKE_BUILD_TYPE= \
            "-DCMAKE_CXX_FLAGS=${{ matrix.flag }}" \
            -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-optimization --parallel 2
      - name: Test
        run: ctest --test-dir build-optimization --output-on-failure

  fuzz-smoke:
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          cmake -S . -B build-fuzz \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DPVCROTSYMENC1_BUILD_FUZZERS=ON \
            -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
      - name: Build fuzzers
        run: |
          cmake --build build-fuzz \
            --target pvc-rotsymenc1-fuzz-seal-equivalence \
                     pvc-rotsymenc1-fuzz-open-equivalence \
            --parallel 2
      - name: Deterministic fuzz smoke
        run: ctest --test-dir build-fuzz -L fuzz --output-on-failure

  streamframe-domain-analysis:
    name: StreamFrame analysis (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@v7
      - name: Configure compiler
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            echo "CXX=clang++" >> "$GITHUB_ENV"
          else
            echo "CXX=g++" >> "$GITHUB_ENV"
          fi
      - name: Run pre-registered StreamFrame campaign
        run: ./scripts/run_streamframe_domain_audit.sh build-streamframe-domain
      - name: Build timing characterization harness
        run: |
          cmake --build build-streamframe-domain \
            --target pvc-rotsymenc1-timing-characterization \
            --parallel 2

  bounded-verification:
    runs-on: ubuntu-24.04
    env:
      CBMC_VERSION: "6.10.0"
      CBMC_SHA256: "d716c219c5318a54f5298f9d5f66766d599e2e37bede33224437a8ad487fc504"
    steps:
      - uses: actions/checkout@v7
      - name: Download pinned CBMC
        run: |
          curl -L --fail --silent --show-error \
            "https://github.com/diffblue/cbmc/releases/download/cbmc-${CBMC_VERSION}/ubuntu-24.04-cbmc-${CBMC_VERSION}-Linux.deb" \
            -o "${RUNNER_TEMP}/cbmc.deb"
          echo "${CBMC_SHA256}  ${RUNNER_TEMP}/cbmc.deb" | sha256sum --check
          dpkg-deb --extract "${RUNNER_TEMP}/cbmc.deb" "${RUNNER_TEMP}/cbmc"
      - name: Run bounded verification
        env:
          CBMC: ${{ runner.temp }}/cbmc/usr/bin/cbmc
        run: ./scripts/run_cbmc.sh

  arm64-conformance:
    name: conformance (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-arm64-gcc
            os: ubuntu-24.04-arm
            cc: gcc
            cxx: g++
          - platform: macos-arm64-clang
            os: macos-15
            cc: clang
            cxx: clang++
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@v7
      - name: Record toolchain
        run: |
          uname -a
          "${CXX}" --version | head -n 1
      - name: Configure
        run: |
          cmake -S . -B build-conformance \
            -DCMAKE_BUILD_TYPE=Release \
            -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build build-conformance --parallel 2
      - name: Test
        run: ctest --test-dir build-conformance --output-on-failure
      - name: Verify byte-identical corpus
        run: |
          python3 scripts/verify_cross_platform_conformance.py \
            --generator build-conformance/pvc-rotsymenc1-cross-platform-conformance

  windows-conformance:
    name: conformance (windows-${{ matrix.compiler }})
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        compiler: [msvc, clang-cl]
    steps:
      - uses: actions/checkout@v7
      - name: Record toolchain
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "msvc") {
            cmake --version | Select-Object -First 1
          } else {
            clang-cl --version | Select-Object -First 1
          }
      - name: Configure
        shell: pwsh
        run: |
          if ("${{ matrix.compiler }}" -eq "msvc") {
            cmake -S . -B build-conformance -A x64 `
              -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
          } else {
            cmake -S . -B build-conformance -A x64 -T ClangCL `
              -DPVCROTSYMENC1_WARNINGS_AS_ERRORS=ON
          }
      - name: Build
        run: cmake --build build-conformance --config Release --parallel 2
      - name: Test
        run: ctest --test-dir build-conformance -C Release --output-on-failure
      - name: Verify byte-identical corpus
        shell: pwsh
        run: |
          $generator = "build-conformance/Release/pvc-rotsymenc1-cross-platform-conformance.exe"
          python scripts/verify_cross_platform_conformance.py --generator $generator
